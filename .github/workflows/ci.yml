name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest
      - name: Validate data (lenient, pull requests)
        if: github.event_name == 'pull_request'
        run: python scripts/validate.py
      - name: Validate data (strict, main)
        if: github.event_name == 'push'
        run: python scripts/validate.py --strict
      - name: Check READMEs are in sync with data
        if: github.event_name == 'push'
        run: python scripts/build.py && git diff --exit-code -- 'README*.md'

  awesome-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npx -y awesome-lint@2.3.0 README.md
