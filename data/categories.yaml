  intro:
    en: Specifications and official documentation that govern how AI crawlers access a site and how answer engines read its content.
    zh-CN: 规定 AI 爬虫如何访问网站、AI 回答引擎如何读取内容的技术规范与官方文档。
    ja: AI クローラーによるサイトへのアクセスや、AI 回答エンジンによるコンテンツの読み取りを左右する仕様と公式ドキュメントです。
    ko: AI 크롤러가 사이트에 접근하는 방식과 AI 답변 엔진이 콘텐츠를 읽는 방식을 규정하는 사양과 공식 문서입니다.
    es: Especificaciones y documentación oficial que determinan cómo acceden los rastreadores de IA a un sitio y cómo leen su contenido los motores de respuestas.
    de: Spezifikationen und offizielle Dokumentation dazu, wie KI-Crawler auf eine Website zugreifen und wie Antwortmaschinen ihre Inhalte auslesen.
