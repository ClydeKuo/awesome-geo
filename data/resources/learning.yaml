  - global
  desc:
    en: Podcast from the Google Search Relations team about how Google Search works behind the scenes, including its AI features and current SEO community topics.
    zh-CN: Google 搜索关系团队的播客，讲述 Google 搜索幕后的工作原理，包括其 AI 功能和 SEO 社区的热门话题。
    ja: Google 検索の舞台裏を、AI 機能や SEO コミュニティの最新の話題も含めて語る、Google Search Relations チームのポッドキャストです。
    ko: Google Search Relations 팀의 팟캐스트로, AI 기능을 포함한 Google 검색의 내부 작동 방식과 최근 SEO 커뮤니티 화제를 다룹니다.
    es: Pódcast del equipo de Search Relations de Google sobre el funcionamiento interno de la Búsqueda de Google, incluidas sus funciones de IA y temas de actualidad de la comunidad SEO.
    de: Podcast des Google-Search-Relations-Teams darüber, wie die Google-Suche hinter den Kulissen funktioniert, einschließlich ihrer KI-Funktionen und aktueller Themen der SEO-Community.
