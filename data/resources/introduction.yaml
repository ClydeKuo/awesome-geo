- id: sej-google-ai-search-guide-still-seo
  name: Google's New AI Search Guide Calls AEO and GEO 'Still SEO'
  url: https://www.searchenginejournal.com/googles-new-ai-search-guide-calls-aeo-and-geo-still-seo/575026/
  category: introduction
  type: article
  pricing: free
  open_source: false
  regions:
  - global
  desc:
    en: Search Engine Journal report on Google's May 2026 guidance treating AEO and GEO as part of ordinary SEO and debunking llms.txt and chunking.
    zh-CN: Search Engine Journal 报道 Google 2026 年 5 月的指南将答案引擎优化（AEO）和生成式引擎优化（GEO）归入常规 SEO，并否定 llms.txt 和内容分块。
    ja: AEO と GEO も SEO の一部とし、llms.txt やチャンク分割を否定した Google の 2026年5月のガイダンスを伝える Search Engine Journal の記事です。
    ko: AEO와 GEO를 일반 SEO의 일부로 보고 llms.txt와 청킹의 효과를 부정한 2026년 5월 Google 가이드를 다룬 Search Engine Journal 기사입니다.
    es: Artículo de Search Engine Journal sobre la guía de Google de mayo de 2026 que trata el AEO y el GEO como parte del SEO habitual y desmiente la utilidad de llms.txt y la fragmentación del contenido.
    de: Bericht von Search Engine Journal über Googles Leitfaden vom Mai 2026, der AEO und GEO als Teil gewöhnlicher SEO behandelt und llms.txt und Chunking als Mythen entlarvt.
- id: google-optimizing-for-generative-ai-features
