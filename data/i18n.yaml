contributing_text:
  en: Contributions are welcome. Please read the [contribution guidelines](CONTRIBUTING.md) before opening a pull request; an English description is all you need, and maintainers add the other languages.
  zh-CN: 欢迎参与贡献。提交 Pull Request 前请先阅读[贡献指南](CONTRIBUTING.md#贡献指南)；只需填写英文描述，其他语言由维护者补齐。
  ja: コントリビューションを歓迎します。プルリクエストを送る前に[コントリビューションガイド](CONTRIBUTING.md)をお読みください。説明文は英語だけで構いません。ほかの言語はメンテナーが追加します。
  ko: 기여를 환영합니다. 풀 리퀘스트를 보내기 전에 [기여 가이드](CONTRIBUTING.md)를 읽어 주세요. 설명은 영어로만 작성하면 되며, 다른 언어는 메인테이너가 추가합니다.
  es: Las contribuciones son bienvenidas. Antes de abrir un pull request, lee la [guía de contribución](CONTRIBUTING.md); basta con escribir la descripción en inglés y los mantenedores añaden el resto de idiomas.
  de: Beiträge sind willkommen. Bitte lies vor einem Pull Request die [Hinweise zum Mitwirken](CONTRIBUTING.md); eine englische Beschreibung genügt, die übrigen Sprachen ergänzen die Maintainer.
