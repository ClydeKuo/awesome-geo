- id: ietf-aipref
  name: IETF AI Preferences (aipref) working group
  url: https://datatracker.ietf.org/wg/aipref/about
  category: standards/crawlers
  type: spec
  pricing: free
  open_source: false
  regions:
  - global
  desc:
    en: Standardizes a common vocabulary and attachment methods, such as robots.txt and HTTP headers, for expressing preferences on how content is collected and used by AI.
    zh-CN: 制定通用词汇及附加方式（如 robots.txt 和 HTTP 头）的标准，用于表达内容被 AI 收集和使用的偏好。
    ja: robots.txt や HTTP ヘッダーなど、AI によるコンテンツの収集・利用についての意向を表明するための共通語彙と付与方法を標準化する作業部会です。
    ko: AI의 콘텐츠 수집·이용에 관한 선호를 표현하는 공통 어휘와, robots.txt나 HTTP 헤더 같은 부착 방식을 표준화합니다.
    es: Normaliza un vocabulario común y mecanismos de vinculación, como robots.txt y cabeceras HTTP, para expresar preferencias sobre cómo recopila y usa la IA el contenido.
    de: Standardisiert ein gemeinsames Vokabular und Einbindungswege wie robots.txt und HTTP-Header, um Präferenzen zur Erfassung und Nutzung von Inhalten durch KI auszudrücken.
- id: ietf-webbotauth
  name: IETF Web Bot Auth working group
  url: https://datatracker.ietf.org/wg/webbotauth/about
  category: standards/crawlers
  type: spec
  pricing: free
  open_source: false
  regions:
  - global
  desc:
    en: Standardizes methods for cryptographically authenticating automated clients such as AI crawlers and agents, replacing IP allowlists and user-agent strings.
    zh-CN: 制定以加密方式认证 AI 爬虫、智能体等自动化客户端的标准方法，以取代 IP 白名单和 User-Agent 字符串。
    ja: IP アドレスの許可リストやユーザーエージェント文字列に代わり、AI クローラーやエージェントなどの自動クライアントを暗号技術で認証する方法を標準化する作業部会です。
    ko: IP 허용 목록과 사용자 에이전트 문자열을 대신해 AI 크롤러, 에이전트 등 자동화 클라이언트를 암호학적으로 인증하는 방법을 표준화합니다.
    es: Normaliza métodos para autenticar criptográficamente clientes automatizados, como rastreadores y agentes de IA, en sustitución de las listas de IP permitidas y las cadenas de user agent.
    de: Standardisiert Verfahren zur kryptografischen Authentifizierung automatisierter Clients wie KI-Crawler und -Agenten als Ersatz für IP-Allowlists und User-Agent-Strings.
