      title: {en: Foundational Papers, zh-CN: 奠基性论文, ja: 基礎となる論文, ko: 기초 논문, es: Trabajos fundacionales, de: Grundlagenarbeiten}
    - id: benchmarks-datasets
      title: {en: Benchmarks and Datasets, zh-CN: 基准与数据集, ja: ベンチマークとデータセット, ko: 벤치마크와 데이터셋, es: Benchmarks y conjuntos de datos, de: Benchmarks und Datensätze}
    - id: adversarial
      title: {en: Attacks and Manipulation, zh-CN: 攻击与操纵, ja: 攻撃と操作, ko: 공격과 조작, es: Ataques y manipulación, de: Angriffe und Manipulation}
      intro:
        en: Adversarial GEO research on how answer engines can be manipulated, for example through prompt injection or ranking attacks, and how to defend against it.
        zh-CN: 对抗性 GEO 研究，关注 AI 回答引擎如何通过提示词注入、排名操纵等手段被操控，以及相应的防御方法。
        ja: プロンプトインジェクションやランキング攻撃などによって AI 回答エンジンが操作される仕組みと、その防御策を扱う敵対的 GEO の研究です。
        ko: 프롬프트 인젝션이나 순위 조작 공격 등으로 AI 답변 엔진이 조작되는 방식과 그 방어 방법을 다루는 적대적 GEO 연구입니다.
        es: Investigación sobre GEO adversarial, es decir, cómo se puede manipular un motor de respuestas mediante inyección de prompts o ataques al ranking, y cómo defenderse.
        de: Forschung zu Adversarial GEO, also dazu, wie sich Antwortmaschinen etwa per Prompt-Injection oder Ranking-Angriffen manipulieren lassen und wie man sich dagegen schützt.
    - id: citation-visibility
      title: {en: Citation and Visibility Analysis, zh-CN: 引用与可见度分析, ja: 引用と可視性の分析, ko: 인용 및 가시성 분석, es: Análisis de citas y visibilidad, de: Zitations- und Sichtbarkeitsanalysen}
