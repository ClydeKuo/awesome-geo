  url: https://developers.google.com/search/docs/fundamentals/ai-optimization-guide
  category: introduction
  type: guide
  pricing: free
  open_source: false
  regions:
  - global
  desc:
    en: Google's own guidance, stating that optimizing for AI features is still SEO and listing tactics such as llms.txt and chunking as unnecessary.
    zh-CN: Google 官方指南，指出针对 AI 功能的优化本质上仍是 SEO，并将 llms.txt 和内容分块等做法列为不必要。
    ja: AI 機能向けの最適化も SEO にほかならないとし、llms.txt やチャンク分割などの施策は不要だと明記した Google 自身のガイダンスです。
    ko: AI 기능을 위한 최적화도 결국 SEO라고 밝히고 llms.txt나 청킹 같은 전술은 필요하지 않다고 정리한 Google의 공식 가이드입니다.
    es: Guía de la propia Google que afirma que optimizar para las funciones de IA sigue siendo SEO y considera innecesarias tácticas como llms.txt o la fragmentación del contenido.
    de: Googles eigener Leitfaden, nach dem die Optimierung für KI-Funktionen weiterhin SEO ist und Taktiken wie llms.txt und Chunking unnötig sind.
