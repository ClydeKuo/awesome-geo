what_is_geo_title:
  en: What is GEO
  zh-CN: 什么是 GEO
  ja: GEO とは
  ko: GEO 소개
  es: Qué es GEO
  de: Was ist GEO
what_is_geo:
  en: >-
    Generative Engine Optimization (GEO) is the practice of making content easy for AI answer engines
    such as ChatGPT, Perplexity and Google AI Overviews to find, understand and cite.
    Where SEO competes for rankings in a list of links, GEO aims to have content quoted or referenced
    inside the generated answer itself, so success is measured in citations and visibility rather than clicks.
    The term was coined in the paper “GEO: Generative Engine Optimization”
    by Aggarwal et al. (Princeton University and others, KDD 2024).
  zh-CN: "生成式引擎优化（GEO）是一套让内容更容易被 ChatGPT、Perplexity、Google AI Overviews 等 AI 回答引擎发现、理解和引用的方法。SEO 争夺的是搜索结果列表中的排名，而 GEO 追求的是内容直接出现在 AI 生成的答案中并被引用或提及，因此衡量效果看的是引用和可见度，而不是点击量。这一概念出自普林斯顿大学等机构的 Aggarwal 等人发表于 KDD 2024 的论文《GEO: Generative Engine Optimization》。"
  ja: "生成エンジン最適化（GEO）とは、ChatGPT、Perplexity、Google の AI Overviews などの AI 回答エンジンがコンテンツを見つけ、理解し、引用しやすくするための取り組みです。SEO が検索結果のリンク一覧での順位を競うのに対し、GEO は AI が生成する回答そのものの中でコンテンツが引用・言及されることを目指すため、成果はクリック数ではなく引用や可視性で測ります。この概念は、プリンストン大学などの Aggarwal らが KDD 2024 で発表した論文「GEO: Generative Engine Optimization」で提唱されました。"
  ko: >-
    생성형 엔진 최적화(GEO)는 ChatGPT, Perplexity, Google AI Overviews 같은 AI 답변 엔진이 콘텐츠를 쉽게 찾고 이해하며 인용할 수 있도록 만드는 작업입니다.
    SEO가 검색 결과 목록에서 순위를 다툰다면 GEO는 AI가 생성한 답변 안에서 콘텐츠가 직접 인용되거나 언급되는 것을 목표로 하며, 따라서 성과도 클릭 수보다 인용과 가시성으로 측정합니다.
    이 개념은 프린스턴 대학교 등의 Aggarwal 외 연구진이 KDD 2024에서 발표한 논문 “GEO: Generative Engine Optimization”에서 처음 제시되었습니다.
  es: >-
    La optimización para motores generativos (GEO, por sus siglas en inglés) consiste en lograr que motores de respuestas con IA
    como ChatGPT, Perplexity o Google AI Overviews encuentren, entiendan y citen un contenido con facilidad.
    Mientras que el SEO compite por posiciones en una lista de enlaces, el GEO busca que el contenido aparezca citado o mencionado
    dentro de la propia respuesta generada, por lo que el éxito se mide en citas y visibilidad más que en clics.
    El término procede del artículo «GEO: Generative Engine Optimization»
    de Aggarwal et al. (Universidad de Princeton y otras instituciones, KDD 2024).
  de: >-
    Generative Engine Optimization (GEO) umfasst alle Maßnahmen, mit denen Inhalte für KI-Antwortmaschinen wie ChatGPT,
    Perplexity oder Google AI Overviews leichter auffindbar, verständlich und zitierbar werden.
    Während es bei SEO um Rankings in einer Trefferliste geht, zielt GEO darauf ab, dass Inhalte direkt in der generierten Antwort
    zitiert oder erwähnt werden; der Erfolg bemisst sich daher eher an Zitationen und Sichtbarkeit als an Klicks.
    Der Begriff stammt aus dem Paper »GEO: Generative Engine Optimization«
    von Aggarwal et al. (Princeton University u. a., KDD 2024).
