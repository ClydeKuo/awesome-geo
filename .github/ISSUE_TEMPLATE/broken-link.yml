name: Report a broken link
description: A link in the list is dead, moved or wrong
title: "[Broken link] "
labels: [broken-link]
body:
  - type: input
    id: url
    attributes:
      label: Broken URL
    validations:
      required: true
  - type: input
    id: replacement
    attributes:
      label: Replacement URL (if known)
  - type: textarea
    id: notes
    attributes:
      label: Notes
